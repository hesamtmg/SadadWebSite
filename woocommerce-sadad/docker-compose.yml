name: woocommerce-sadad

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  SADAD_MODE: ${SADAD_MODE}
  SADAD_SANDBOX_INTERNAL_URL: http://sadad-mock
  SADAD_SANDBOX_PUBLIC_URL: http://localhost:${SADAD_SANDBOX_PORT}
  SADAD_SANDBOX_MERCHANT_ID: ${SANDBOX_MERCHANT_ID:-000000140336964}
  SADAD_SANDBOX_TERMINAL_ID: ${SANDBOX_TERMINAL_ID:-24095674}
  SADAD_SANDBOX_TERMINAL_KEY: ${SANDBOX_TERMINAL_KEY:-O0hoZrcZPeGRqEEMRuwJlmuBSaVkmpEu}

x-wp-volumes: &wp-volumes
  - wordpress:/var/www/html
  - ./plugins/sadad-electronic-payment:/var/www/html/wp-content/plugins/sadad-electronic-payment
  - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment:
      <<: *wp-env
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${SITE_URL}');
        define('WP_SITEURL', '${SITE_URL}');
        define('FS_METHOD', 'direct');
    volumes: *wp-volumes

  # Runs once: installs WordPress + WooCommerce, products and gateway settings, then exits.
  setup:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      <<: *wp-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      SITE_URL: ${SITE_URL}
      SITE_TITLE: ${SITE_TITLE}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      WP_LOCALE: ${WP_LOCALE}
      WOOCOMMERCE_VERSION: ${WOOCOMMERCE_VERSION}
      STORE_CURRENCY: ${STORE_CURRENCY}
      SHIPPING_COST: ${SHIPPING_COST}
      FREE_SHIPPING_MIN: ${FREE_SHIPPING_MIN}
      SADAD_MERCHANT_ID: ${SADAD_MERCHANT_ID:-}
      SADAD_TERMINAL_ID: ${SADAD_TERMINAL_ID:-}
      SADAD_TERMINAL_KEY: ${SADAD_TERMINAL_KEY:-}
    volumes:
      - wordpress:/var/www/html
      - ./plugins/sadad-electronic-payment:/var/www/html/wp-content/plugins/sadad-electronic-payment
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./setup:/setup:ro
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    restart: "no"

  # Local stand-in for sadad.shaparak.ir (used when SADAD_MODE=sandbox).
  sadad-mock:
    image: php:8.3-cli-alpine
    restart: unless-stopped
    ports:
      - "${SADAD_SANDBOX_PORT}:80"
    environment:
      SADAD_MERCHANT_ID: ${SANDBOX_MERCHANT_ID:-000000140336964}
      SADAD_TERMINAL_ID: ${SANDBOX_TERMINAL_ID:-24095674}
      SADAD_TERMINAL_KEY: ${SANDBOX_TERMINAL_KEY:-O0hoZrcZPeGRqEEMRuwJlmuBSaVkmpEu}
    volumes:
      - ./sadad-mock:/app:ro
    command: ["php", "-S", "0.0.0.0:80", "-t", "/app", "/app/index.php"]

volumes:
  db:
  wordpress:
